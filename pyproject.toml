[project]
name = "pyerp"
version = "0.1.0"
description = "Reusable Postgres-backed durable workflow engine"
readme = "README.md"
authors = [
    { name = "Dat Giang", email = "datgs@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "chancy>=0.26.0",
    "croniter>=7.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "chancy.*"
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    ".spikes/kernel",
]
