[project]
name = "keelflow"
version = "0.1.0a3"
description = "Reusable Postgres-backed durable workflow engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dat Giang", email = "datgs@users.noreply.github.com" }
]
keywords = ["workflow", "durable", "postgres", "jobs", "state-machine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "chancy>=0.26.0",
    "croniter>=7.0.0",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "src",
    "examples/invoice_flow/src",
    "examples/supplier_onboarding/src",
    "examples/bulk_import/src",
    "examples/rag_demo/src",
    "examples/financial_approval/src",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "chancy.*"
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    ".spikes/kernel",
    "examples/*",
]
