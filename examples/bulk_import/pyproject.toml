[project]
name = "keelflow-demo-import"
version = "0.1.0"
description = "keelflow demo 3: bulk CSV import — HITL mapping, chunk/row processing, error queue"
requires-python = ">=3.11"
dependencies = [
    "keelflow",
    "fastapi>=0.124",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bulk_import"

[tool.uv.sources]
keelflow = { workspace = true }
