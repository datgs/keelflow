[project]
name = "keelflow-demo-supplier"
version = "0.1.0"
description = "keelflow demo: ~20-step supplier onboarding DAG — parallel checks, conditional HITL, mock adapters"
requires-python = ">=3.11"
dependencies = [
    "keelflow",
    "fastapi>=0.124",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "supplier_onboarding"

[tool.uv.sources]
keelflow = { workspace = true }
