<!doctype html>
<html>
<head>
  <title>{% block title %}keelflow invoice demo{% endblock %}</title>
  <style>
    :root { --fg:#1c2333; --mut:#6b7280; --bg:#f6f7f9; --card:#fff;
            --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --line:#e5e7eb;
            --accent:#1d4ed8; }
    * { box-sizing: border-box; }
    body { font: 14px/1.45 -apple-system, "SF Pro", sans-serif; margin:0;
           color:var(--fg); background:var(--bg); }
    header { background:#111827; color:#fff; padding:10px 20px;
             display:flex; gap:18px; align-items:center; }
    header a { color:#93c5fd; text-decoration:none; }
    header .who { margin-left:auto; color:#9ca3af; }
    main { max-width: 980px; margin: 24px auto; padding: 0 16px; }
    .card { background:var(--card); border:1px solid var(--line);
            border-radius:8px; padding:16px 18px; margin-bottom:16px; }
    table { border-collapse:collapse; width:100%; }
    th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--mut); font-size:12px; text-transform:uppercase; }
    .state { display:inline-block; padding:2px 10px; border-radius:999px;
             font-size:12px; font-weight:600; }
    .s-draft,.s-in_review { background:#e0e7ff; color:#3730a3; }
    .s-posting { background:#fef3c7; color:#92400e; }
    .s-posted { background:#dcfce7; color:var(--ok); }
    .s-needs_fix,.s-posting_rejected { background:#fee2e2; color:var(--bad); }
    .s-posting_failed { background:#fecaca; color:#7f1d1d; }
    button, .btn { font:inherit; padding:5px 14px; border-radius:6px;
                   border:1px solid var(--line); background:#fff;
                   cursor:pointer; }
    .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn-danger { background:#fff; color:var(--bad); border-color:var(--bad); }
    .err { background:#fee2e2; color:var(--bad); padding:8px 12px;
           border-radius:6px; margin-bottom:12px; }
    .mut { color:var(--mut); font-size:12px; }
    .dag { display:flex; align-items:center; gap:0; margin:12px 0; flex-wrap:wrap; }
    .node { border:1.5px solid var(--line); border-radius:8px; padding:10px 14px;
            min-width:120px; text-align:center; background:#fff; }
    .node .nstatus { font-size:11px; font-weight:700; text-transform:uppercase; }
    .node.done .nstatus { color:var(--ok); }
    .node.failed .nstatus { color:var(--bad); }
    .node.claimed,.node.running .nstatus { color:#0369a1; }
    .node.pending .nstatus { color:var(--mut); }
    .node.blocked { border-style:dashed; border-color:#d97706; }
    .node.blocked .nstatus { color:var(--warn); }
    .edge { width:36px; height:2px; background:var(--line); }
    .edge.on { background:var(--ok); }
    input { font:inherit; padding:5px 8px; border:1px solid var(--line);
            border-radius:6px; }
    pre { background:#0f172a; color:#e2e8f0; padding:12px; border-radius:6px;
          overflow:auto; font-size:12px; }
  </style>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
mermaid.initialize({startOnLoad:true, theme:"dark"});
</script>
</head>
<body>
<header>
  <strong>keelflow · invoice_flow</strong>
  <a href="/?as={{ me }}">Invoices</a>
  <a href="/inbox?as={{ me }}">Inbox</a>
  <span class="who">acting as
    {% for u in ["u1","fin1","gl1","mgr"] %}
      <a href="?as={{ u }}" style="color:{{ '#fff' if u==me else '#9ca3af' }}">{{ u }}</a>{{ "·" if not loop.last }}
    {% endfor %}
    &nbsp;— demo only, no auth</span>
</header>
<main>
{% if err %}<div class="err">{{ err }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
